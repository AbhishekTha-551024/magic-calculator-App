# Standard Gradle properties
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED

# Force Gradle to use Android Studio's JDK 21 (JBR) to avoid Java 25 class version 69 incompatibility
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Android properties
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Fix for "Execution failed for JdkImageTransform" error on Windows with AGP 8.x
# This disables the transformation that uses jlink, which often fails with JDK mismatch.
android.experimental.enableJdkImageTransform=false
android.jdk.cache.disabled=true

# Suppress AGP 8.5.2 compatibility warning for compileSdk=35
# AGP 8.5.2 was tested up to 34, but 35 builds correctly with this flag.
android.suppressUnsupportedCompileSdk=35
